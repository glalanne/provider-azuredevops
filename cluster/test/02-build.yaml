apiVersion: pipelines.azuredevops.m.crossplane.io/v1alpha1
kind: BuildDefinition
metadata:
  annotations:
    meta.upbound.io/example-id: pipelines/v1alpha1/builddefinition
  labels:
    testing.upbound.io/example-name: build-example
  name: build-example
  namespace: default
spec:
  forProvider:
    ciTrigger:
      useYaml: false
    name: Example Build Definition
    path: \ExampleFolder
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: project-example
    repository:
      branchName: main
      repoIdSelector:
        matchLabels:
          testing.upbound.io/example-name: repo-example
      repoType: TfsGit
      ymlPath: azure-pipelines.yml
    variable:
    - name: PipelineVariable
      value: Go Microsoft!
    variableGroupsRefs:
    - name: vg-example




