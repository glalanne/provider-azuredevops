apiVersion: project.azuredevops.m.crossplane.io/v1alpha1
kind: Project
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/project
  labels:
    testing.upbound.io/example-name: project-example
  name: projet-example
  namespace: default
spec:
  forProvider:
    description: This is an example project created using Crossplane.
    features:
      artifacts: disabled
      testplans: disabled
    name: Example Project
    versionControl: Git
    visibility: private
    workItemTemplate: Agile
---
apiVersion: pipelines.azuredevops.m.crossplane.io/v1alpha1
kind: BuildFolder
metadata:
  annotations:
    meta.upbound.io/example-id: pipelines/v1alpha1/buildfolder
  labels:
    testing.upbound.io/example-name: folder-example
  name: folder-example
  namespace: default
spec:
  forProvider:
    description: ExampleFolder description
    path: \ExampleFolder
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: project-example

---
apiVersion: pipelines.azuredevops.m.crossplane.io/v1alpha1
kind: VariableGroup
metadata:
  annotations:
    meta.upbound.io/example-id: pipelines/v1alpha1/builddefinition
  labels:
    testing.upbound.io/example-name: vg-example
  name: vg-example
  namespace: default
spec:
  forProvider:
    allowAccess: true
    description: Managed by Terraform
    name: Example Pipeline Variables
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: project-example
    variable:
    - name: FOO
      value: BAR
